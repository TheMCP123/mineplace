<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mineplace</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <canvas id="world"></canvas>

  <div class="hud top-left">
    <div class="brand">Mineplace</div>
    <div class="mini-stats">
      <span id="coords">X 0 · Y 0</span>
      <span id="zoomLabel">Zoom 1.00x</span>
    </div>
  </div>

  <div class="hud top-center" id="splashBox">
    <div class="splash-main">
      <span id="splashesLabel">Splashes 0/50</span>
      <span id="rechargeLabel">Recharge ready</span>
    </div>
    <div class="splash-bar">
      <div id="splashFill"></div>
    </div>
  </div>

  <div class="hud top-right" id="authBox">
    <button id="loginBtn">Login with Discord</button>
  </div>

  <div class="palette-wrap">
    <div id="palette" class="palette"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app.js"></script>
</body>
</html>
