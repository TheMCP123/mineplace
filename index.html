<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mineplace</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/styles.css?v=25" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
  <canvas id="world"></canvas>

  <div class="hud hud-stats">
    <span id="coords">X 0 · Y 0</span>
    <span id="zoomLabel">Zoom 1.00x</span>
  </div>

  <div class="hud online-bubble hidden" id="onlineBubble">
    <div class="online-pill">
      <span class="online-dot"></span>
      <span id="onlineCount">0 online</span>
    </div>
    <div class="online-popover" id="onlinePopover">
      <div class="online-title">Online players</div>
      <div class="online-list" id="onlineList"></div>
    </div>
  </div>

  <div class="hud hud-blocks" id="blocksBox">
    <div class="blocks-main">
      <span id="blocksLabel">Blocks 0/50</span>
      <span id="rechargeLabel">Recharge ready</span>
    </div>
    <div class="blocks-bar"><div id="blocksFill"></div></div>
  </div>

  <div class="hud auth-box" id="authBox"></div>

  <div class="hud map-actions">
    <button id="viewMapBtn" class="small-btn" type="button">View PNG</button>
    <button id="downloadMapBtn" class="small-btn" type="button">Download PNG</button>
  </div>

  <div class="palette-wrap">
    <div class="palette-head">
      <input id="blockSearch" class="search-input" type="search" placeholder="Search blocks..." autocomplete="off" spellcheck="false" />
      <span id="blockCount" class="block-count">0 blocks</span>
    </div>
    <div id="palette" class="palette"></div>
    <input id="inventorySlider" class="inventory-slider" type="range" min="0" max="0" value="0" />
  </div>

  <div id="inspectModal" class="sheet-modal hidden">
    <div class="sheet-card">
      <div class="sheet-head">
        <strong>Block info</strong>
        <button id="inspectCloseBtn" class="small-btn" type="button">Close</button>
      </div>
      <div id="inspectCoords" class="sheet-note">X 0 · Y 0</div>
      <div id="inspectOwnerCard" class="inspect-owner-card">
        <div class="inspect-avatar-wrap"><img id="inspectAvatar" class="inspect-avatar hidden" alt=""><div id="inspectAvatarFallback" class="online-avatar-fallback">?</div></div>
        <div class="inspect-meta">
          <div id="inspectOwnerName" class="inspect-owner-name">Unknown</div>
          <div id="inspectOwnerNote" class="sheet-note">No owner</div>
        </div>
      </div>
      <div class="sheet-actions">
        <button id="inspectReportBtn" class="small-btn primary" type="button">Report player</button>
      </div>
    </div>
  </div>

  <div id="reportModal" class="sheet-modal hidden">
    <div class="sheet-card">
      <div class="sheet-head">
        <strong>Report player</strong>
        <button id="reportCloseBtn" class="small-btn" type="button">Close</button>
      </div>
      <div class="sheet-grid">
        <label class="sheet-label">
          <span>Username</span>
          <input id="reportUsernameInput" class="admin-input" type="text" list="reportUsernames" placeholder="themcp123" autocomplete="off" spellcheck="false" />
          <datalist id="reportUsernames"></datalist>
        </label>

        <label class="sheet-label">
          <span>Reason</span>
          <select id="reportReasonInput" class="admin-input">
            <option value="Inappropriate Art">Inappropriate Art</option>
            <option value="Harassment">Harassment</option>
            <option value="Offensive Text">Offensive Text</option>
            <option value="Spam / Griefing">Spam / Griefing</option>
            <option value="Other">Other</option>
          </select>
        </label>

        <label class="sheet-label full">
          <span>Extra details</span>
          <textarea id="reportDetailsInput" class="admin-input admin-textarea" rows="4" placeholder="Optional details..."></textarea>
        </label>
      </div>
      <div id="reportContextNote" class="sheet-note">Manual report</div>
      <div class="sheet-actions">
        <button id="reportSubmitBtn" class="small-btn primary" type="button">Send report</button>
      </div>
    </div>
  </div>

  <div id="adminModal" class="admin-modal hidden">
    <div class="admin-card">
      <div class="admin-head">
        <strong>Admin Panel</strong>
        <button id="adminCloseBtn" class="small-btn" type="button">Close</button>
      </div>

      <div class="admin-row">
        <input id="adminSearchInput" class="admin-input" type="search" placeholder="Search username..." autocomplete="off" spellcheck="false" />
        <button id="adminSearchBtn" class="small-btn" type="button">Search</button>
      </div>

      <div id="adminUsers" class="admin-users"></div>

      <div id="adminEdit" class="admin-edit hidden">
        <div class="admin-selected" id="adminSelectedUser">No user selected</div>

        <div class="admin-row">
          <button id="adminMinusBtn" class="small-btn" type="button">-5</button>
          <input id="adminBlocksInput" class="admin-input number" type="number" min="0" max="50" value="50" />
          <button id="adminPlusBtn" class="small-btn" type="button">+5</button>
          <button id="adminSetBtn" class="small-btn primary" type="button">Set</button>
        </div>

        <div class="admin-note">Blocks are clamped from 0 to 50.</div>

        <div class="admin-ban-box">
          <div id="adminBanStatus" class="admin-note">Ban status: not banned</div>

          <div class="admin-row wrap">
            <button id="adminBan1hBtn" class="small-btn danger-btn" type="button">Ban 1h</button>
            <button id="adminBan1dBtn" class="small-btn danger-btn" type="button">Ban 1d</button>
            <button id="adminBan7dBtn" class="small-btn danger-btn" type="button">Ban 7d</button>
            <button id="adminBanForeverBtn" class="small-btn danger-btn" type="button">Ban forever</button>
            <button id="adminUnbanBtn" class="small-btn primary" type="button">Unban</button>
          </div>
        </div>
      </div>

      <div class="admin-section">
        <div class="admin-section-head">
          <strong>Reports</strong>
          <button id="adminRefreshReportsBtn" class="small-btn" type="button">Refresh</button>
        </div>
        <div id="adminReports" class="admin-users"></div>
      </div>
    </div>
  </div>

  <div class="site-meta">
    <div class="site-version">Version 25</div>
    <div class="site-since">Since 6/30/2026 California</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app.js?v=25"></script>
</body>
</html>
