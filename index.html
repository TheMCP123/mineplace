<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mineplace</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/styles.css" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
  <canvas id="world"></canvas>

  <div class="hud hud-stats">
    <span id="coords">X 0 · Y 0</span>
    <span id="zoomLabel">Zoom 1.00x</span>
  </div>


  <div class="hud online-bubble hidden" id="onlineBubble">
    <div class="online-pill">
      <span class="online-dot"></span>
      <span id="onlineCount">0 online</span>
    </div>

    <div class="online-popover" id="onlinePopover">
      <div class="online-title">Online players</div>
      <div class="online-list" id="onlineList"></div>
    </div>
  </div>

  <div class="hud hud-blocks" id="blocksBox">
    <div class="blocks-main">
      <span id="blocksLabel">Blocks 0/50</span>
      <span id="rechargeLabel">Recharge ready</span>
    </div>
    <div class="blocks-bar">
      <div id="blocksFill"></div>
    </div>
  </div>

  <div class="hud hud-auth" id="authBox">
    <button id="loginBtn">Login with Discord</button>
  </div>


  <div class="hud map-actions">
    <button id="viewMapBtn" class="small-btn">View PNG</button>
    <button id="downloadMapBtn" class="small-btn">Download PNG</button>
  </div>

  <div class="palette-wrap">
    <div class="inventory-top">
      <input id="blockSearch" class="block-search" type="search" placeholder="Search blocks..." autocomplete="off" spellcheck="false" />
      <span id="blockCount" class="block-count">0 blocks</span>
    </div>

    <div id="palette" class="palette"></div>

    <input id="inventorySlider" class="inventory-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Inventory scroll" />
  </div>


  <div id="adminModal" class="admin-modal hidden">
    <div class="admin-card">
      <div class="admin-head">
        <strong>Admin Panel</strong>
        <button id="adminCloseBtn" class="small-btn">Close</button>
      </div>

      <div class="admin-row">
        <input id="adminSearchInput" class="admin-input" type="search" placeholder="Search username..." autocomplete="off" spellcheck="false" />
        <button id="adminSearchBtn" class="small-btn">Search</button>
      </div>

      <div id="adminUsers" class="admin-users"></div>

      <div id="adminEdit" class="admin-edit hidden">
        <div class="admin-selected" id="adminSelectedUser">No user selected</div>

        <div class="admin-row">
          <button id="adminMinusBtn" class="small-btn">-5</button>
          <input id="adminBlocksInput" class="admin-input number" type="number" min="0" max="50" value="50" />
          <button id="adminPlusBtn" class="small-btn">+5</button>
          <button id="adminSetBtn" class="small-btn primary">Set</button>
        </div>

        <div class="admin-note">Blocks are clamped from 0 to 50.</div>

        <div class="admin-ban-box">
          <div class="admin-ban-status" id="adminBanStatus">Ban status: unknown</div>

          <div class="admin-row wrap">
            <input id="adminBanReasonInput" class="admin-input" type="text" placeholder="Ban reason..." autocomplete="off" spellcheck="false" />
          </div>

          <div class="admin-row wrap">
            <button id="adminBan1hBtn" class="small-btn danger-btn">Ban 1h</button>
            <button id="adminBan1dBtn" class="small-btn danger-btn">Ban 1d</button>
            <button id="adminBan7dBtn" class="small-btn danger-btn">Ban 7d</button>
            <button id="adminBanForeverBtn" class="small-btn danger-btn">Ban forever</button>
            <button id="adminUnbanBtn" class="small-btn primary">Unban</button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app.js"></script>
  <div class="site-since">Since 6/30/2026 California</div>
</body>
</html>
